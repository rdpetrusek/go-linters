name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - run: go test ./...
      - name: Verify module plugin and direct analyzer import
        env:
          LINTER_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.7.2
          export PATH="$(go env GOPATH)/bin:$PATH"
          revision="$(go list -m -f '{{.Version}}' "github.com/rdpetrusek/go-linters@${LINTER_REVISION}")"
          mkdir "$RUNNER_TEMP/consumer"
          cd "$RUNNER_TEMP/consumer"
          printf 'module example.com/consumer\n\ngo 1.24\n' > go.mod
          printf 'package consumer\n\n// TODO: add owner\nfunc Example() {}\n' > main.go
          printf 'version: v2.7.2\nplugins:\n  - module: github.com/rdpetrusek/go-linters\n    import: github.com/rdpetrusek/go-linters/plugin\n    version: %s\n' "$revision" > .custom-gcl.yml
          printf 'version: "2"\nlinters:\n  default: none\n  enable:\n    - govet\n    - shared\n  settings:\n    custom:\n      shared:\n        type: module\n' > .golangci.yml
          golangci-lint custom
          if ./custom-gcl run ./... > lint.log 2>&1; then
            cat lint.log
            exit 1
          fi
          cat lint.log
          grep -q 'TODO comment must name an owner' lint.log
          grep -q 'interface Worker has 1 concrete implementations' lint.log
          go get "github.com/rdpetrusek/go-linters@${LINTER_REVISION}"
          mkdir -p cmd/check
          printf 'package main\nimport ("github.com/rdpetrusek/go-linters/analyzers/todoowner"; "github.com/rdpetrusek/go-linters/analyzers/multiimpl"; "golang.org/x/tools/go/analysis/multichecker")\nfunc main() { multichecker.Main(todoowner.Analyzer, multiimpl.Analyzer) }\n' > cmd/check/main.go
          go mod tidy
          if go run ./cmd/check . > analyzer.log 2>&1; then
            cat analyzer.log
            exit 1
          fi
          cat analyzer.log
          grep -q 'TODO comment must name an owner' analyzer.log
          grep -q 'interface Worker has 1 concrete implementations' analyzer.log
