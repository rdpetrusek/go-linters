name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - run: go test ./...
      - run: make install
      - run: make lint
      - run: make lint
      - name: Verify a consuming module
        env:
          LINTER_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          go run "github.com/rdpetrusek/go-linters/cmd/go-linters@${LINTER_REVISION}" -dir "$RUNNER_TEMP/shared-linter"
          mkdir "$RUNNER_TEMP/consumer"
          cd "$RUNNER_TEMP/consumer"
          printf 'module example.com/consumer\n\ngo 1.24\n' > go.mod
          printf 'package consumer\n\n// TODO: add owner\nfunc Example() {}\n' > main.go
          cp "$RUNNER_TEMP/shared-linter/go-linters.yml" .golangci.yml
          if "$RUNNER_TEMP/shared-linter/golangci-lint" run ./... > lint.log 2>&1; then
            cat lint.log
            exit 1
          fi
          cat lint.log
          grep -q 'TODO comment must name an owner' lint.log
          go get "github.com/rdpetrusek/go-linters@${LINTER_REVISION}"
          mkdir -p cmd/check
          printf 'package main\nimport ("github.com/rdpetrusek/go-linters/analyzers/todoowner"; "golang.org/x/tools/go/analysis/multichecker")\nfunc main() { multichecker.Main(todoowner.Analyzer) }\n' > cmd/check/main.go
          go mod tidy
          if go run ./cmd/check . > analyzer.log 2>&1; then
            cat analyzer.log
            exit 1
          fi
          cat analyzer.log
          grep -q 'TODO comment must name an owner' analyzer.log
