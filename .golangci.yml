version: "2"
linters:
  enable:
    - shared
    - testpackage
    - gosec
    - errorlint
    - nilerr
    - bodyclose
    - rowserrcheck
    - sqlclosecheck
    - contextcheck
    - unparam
    - gocritic
    - revive
    - thelper
    - nolintlint
  settings:
    custom:
      shared:
        type: module
issues:
  uniq-by-line: false
